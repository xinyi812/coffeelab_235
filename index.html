<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>23.5°N 回甘 | 咖啡實驗室</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>

    <nav>
        <div class="logo">23.5°N 回甘</div>
        <ul class="nav-links">
            <li><a href="index.html">首頁</a></li>
            <li><a href="#encyclopedia">咖啡百科</a></li>
            <li><a href="#cafes">採訪分頁</a></li>
            <li><a href="#game">互動遊戲</a></li>
        </ul>
    </nav>

    <header class="hero">
        <div class="hero-content">
            <h1>探索種子到杯中的藝術</h1>
            <p>在北緯 23.5 度，遇見最純粹的咖啡香氣。</p>
        </div>
    </header>

    <section id="encyclopedia" class="container">
        <h2 class="section-title">咖啡處理法圖鑑</h2>
        <div class="grid">
            
            <div class="card">
                <div class="card-tag">Natural</div>
                <div class="card-img" style="background-image: url('https://images.unsplash.com/photo-1559056199-641a0ac8b55e?auto=format&fit=crop&q=80&w=400');"></div>
                <div class="card-info">
                    <h3>日曬處理法</h3>
                    <p>將咖啡果實完整曝曬於陽光下，吸收大地的精華，風味層次豐富且帶有濃郁果香。</p>
                </div>
            </div>

            <div class="card">
                <div class="card-tag">Washed</div>
                <div class="card-img" style="background-image: url('https://images.unsplash.com/photo-1521500289131-080fd5923bc3?auto=format&fit=crop&q=80&w=400');"></div>
                <div class="card-info">
                    <h3>水洗處理法</h3>
                    <p>透過發酵與大量清水洗淨果肉，口感乾淨明亮，能精準呈現該品種的酸度與花香。</p>
                </div>
            </div>

            <div class="card">
                <div class="card-tag">Honey</div>
                <div class="card-img" style="background-image: url('https://images.unsplash.com/photo-1514432324607-a09d9b4aefdd?auto=format&fit=crop&q=80&w=400');"></div>
                <div class="card-info">
                    <h3>蜜處理法</h3>
                    <p>介於日曬與水洗之間，保留部分果膠進行乾燥，使咖啡帶有蜜一般的甜感與醇厚度。</p>
                </div>
            </div>

        </div>
    </section>

    <section id="game" class="container" style="text-align: center; margin-top: 50px;">
        <h2 class="section-title">互動遊戲體驗</h2>
        <div style="background: #e0dcd5; height: 300px; display: flex; align-items: center; justify-content: center; border-radius: 15px; border: 2px dashed #b5ada2;">
            <p>遊戲嵌入位置 (等隊友做完後放入)</p>
        </div>
    </section>

    <footer>
        <p>&copy; 2026 23.5°N 回甘 畢專團隊</p>
    </footer>

</body>
</html>
