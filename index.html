    <script>
    /* =========================================
       1. 手機版漢堡選單 & 職人咖啡廳收合控制
       ========================================= */
    const mobileMenu = document.querySelector('#mobile-menu');
    const navLinks = document.querySelector('.nav-links');
    const dropdown = document.querySelector('.dropdown');

    if (mobileMenu) {
        // 漢堡按鈕點擊開關
        mobileMenu.addEventListener('click', function() {
            mobileMenu.classList.toggle('active');
            navLinks.classList.toggle('active');
        });

        // 鎖定大標題按鈕
    if (dropdown && dropbtn) {
        dropbtn.addEventListener('click', function(e) {
            // 當螢幕小於等於 768px (手機版) 時
            if (window.innerWidth <= 768) {
                
                // 🌟 關鍵邏輯：如果選單「還沒展開」
                if (!dropdown.classList.contains('show')) {
                    e.preventDefault();  /* 🛑 攔截跳轉 */
                    e.stopPropagation(); /* 🛑 阻止事件冒泡 */
                    dropdown.classList.toggle('show'); /* 展開灰色盒子 */
                } 
                // 💡 如果選單「已經展開了」 (classList 裡面有 show)
                // 網頁就不會進入上面的 if，不會執行 preventDefault，第二次點擊就會直接順利跳轉到 cafes.html 囉！
                
            }
        });
    }

        // 點擊一般連結後自動收起選單
        navLinks.addEventListener('click', function(e) {
            // 如果點擊的是 dropdown 內部或 dropdown 本身，不要自動關閉選單
            if (e.target.closest('.dropdown')) return;

            if (mobileMenu.classList.contains('active')) {
                mobileMenu.classList.remove('active');
                navLinks.classList.remove('active');
            }
        });
    }

    /* =========================================
       2. 咖啡處理法彈窗 (Modal) 控制
       ========================================= */
    function openModal(id) {
        const modal = document.getElementById(id);
        if (modal) {
            modal.style.display = "block";
            document.body.style.overflow = "hidden"; // 鎖定背景滾動
        }
    }

    function closeModal(id, event) {
        if (event) event.stopPropagation(); // 阻止事件冒泡到卡片
        const modal = document.getElementById(id);
        if (modal) {
            modal.style.display = "none";
            document.body.style.overflow = "auto"; // 恢復背景滾動
        }
    }

    // 點擊彈窗背景區域關閉
    window.onclick = function(event) {
        if (event.target.classList.contains('modal')) {
            event.target.style.display = "none";
            document.body.style.overflow = "auto";
        }
    }
</script>

</body>
