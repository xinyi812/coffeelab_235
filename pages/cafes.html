<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>職人咖啡廳總覽 | 23.5°N 的回甘</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="hero" style="height: 35vh; background-image: linear-gradient(rgba(0,0,0,0.3), rgba(0,0,0,0.3)), url('img/cafes-cover.jpg');">
        <div class="hero-content" style="color: #fff; text-align: center; padding-top: 60px;">
            <h1 style="font-size: 2rem; letter-spacing: 2px;">職人咖啡廳</h1>
            <p style="font-size: 1rem; margin-top: 10px;">在北緯 23.5 度，遇見在地職人的沖煮堅持</p>
        </div>
    </header>

    <main class="container" style="margin-top: 50px; margin-bottom: 50px;">
        <div class="grid">
            
            <div class="card" onclick="location.href='qianhua.html'">
                <div class="card-tag">六腳鄉</div>
                <div class="card-img" style="background-image: url('img/qianhua-cover.jpg'); height: 230px; background-size: cover; background-position: center;"></div>
                <div class="card-info">
                    <h3>鉛花咖啡 Qianhua</h3>
                    <p>在六腳的靜謐裡，用咖啡的香氣拉近鄉里間的溫情。結合書香與職人手沖，洗淨鉛華後的醇厚風味。</p>
                </div>
            </div>

            <div class="card" onclick="location.href='slowsoul.html'">
                <div class="card-tag">朴子市</div>
                <div class="card-img" style="background-image: url('img/slowsoul-cover.jpg'); height: 230px; background-size: cover; background-position: center;"></div>
                <div class="card-info">
                    <h3>慢靈魂咖啡 Slow Soul</h3>
                    <p>黑膠唱片、老物件，與一杯極致的單品。讓靈魂慢下來，沉浸在音樂與咖啡交織的復古時光。</p>
                </div>
            </div>

            <div class="card" onclick="location.href='yusen.html'">
                <div class="card-tag">東區</div>
                <div class="card-img" style="background-image: url('img/yusen-cover.jpg'); height: 230px; background-size: cover; background-position: center;"></div>
                <div class="card-info">
                    <h3>裕森咖啡 Yusen</h3>
                    <p>巷弄老宅裡的深夜咖啡館。隱密而純粹，自家烘焙豆展現迷人層次，是咖啡狂熱者的私藏口袋名單。</p>
                </div>
            </div>

        </div>
    </main>

    </body>
</html>
